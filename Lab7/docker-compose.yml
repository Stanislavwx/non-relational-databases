services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-lab7
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser (HTTP)
      - "7687:7687" # Bolt Protocol (Binary)
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./lab7_script.cypher:/scripts/lab7_script.cypher:ro

volumes:
  neo4j_data:
  neo4j_logs:
